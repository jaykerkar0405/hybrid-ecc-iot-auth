name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test with coverage (>=90% on protocol/ and crypto/)
        run: |
          pytest implementation/python/hybrid_ecc_auth/tests/ -q \
            --cov=hybrid_ecc_auth.protocol --cov=hybrid_ecc_auth.crypto \
            --cov-report=term-missing --cov-fail-under=90

  device-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C device core against the independent reference vectors
        run: make -C implementation/c/esp8266/host check
