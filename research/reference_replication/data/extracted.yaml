# Constants and tables extracted from the five PDFs. Every entry carries a source citation:
#   file = path relative to repo root; pdf_page = 1-based page in the PDF file; journal_page = printed page number.
# Values were read from 300-DPI renders (scripts/render_pages.py) and cross-checked against pdftotext where the text layer exists.
# status: VERIFIED = read visually and agrees with text layer or arithmetic; UNVERIFIED = not found / ambiguous in the PDF.
# Time unit in this file: milliseconds, unless a key says otherwise.

sources:
  BASE:    {file: docs/references/base_paper.pdf, cite: "Al-Rasheed et al., IEEE Trans. Consum. Electron. 72(2), May 2026, pp. 4483-4491"}
  JIANG:   {file: docs/references/chaotic_maps_three_factor_authentication.pdf, cite: "Jiang et al., Nonlinear Dyn. 83(4), 2085-2101, 2016"}
  DHILLON: {file: docs/references/lightweight_biometrics_remote_user_authentication_for_iot.pdf, cite: "Dhillon & Kalra, J. Inf. Secur. Appl. 34, 255-270, 2017"}
  CHANGLE: {file: docs/references/provably_secure_authentication_for_ad_hoc_wsn.pdf, cite: "Chang & Le, IEEE Trans. Wireless Commun. 15(1), 357-366, 2016"}
  OURS:    {file: paper/main.pdf, cite: "Do the Numbers Hold on Real Hardware? (this repo)"}

time_constants_ms:
  BASE:
    cite: {file: BASE, pdf_page: 6, journal_page: 4488, table: III}
    status: VERIFIED
    T_ECM: 17.1
    T_C: 0.32          # labelled "Chaotic Map (Chebyshev) Operation"
    T_SE_D: 5.6
    T_H: 0.32          # "Hash Function (one way SHA-1)"
    T_fe: 17.1
  JIANG:
    cite: {file: JIANG, pdf_page: 15, journal_page: "not read (see PDF page)", section: "7 Efficiency discussions"}
    status: VERIFIED
    note: "'According to [20]': T_H ~ 0.20 ms, T_C ~ 32.40 ms on a PIV 3.2 GHz, 3.0 GB RAM. No other constants."
    T_H: 0.20
    T_C: 32.40
  CHANGLE:
    cite: {file: CHANGLE, pdf_page: 8-9, journal_page: "364-365", section: "VI Performance comparison"}
    status: VERIFIED
    note: "t_mul ~ 0.063075 s, t_h ~ 0.0005 s [14] (Xie et al.), t_XOR neglected."
    t_mul: 63.075
    t_h: 0.5
    t_XOR: 0.0
  DHILLON:
    cite: {file: DHILLON, pdf_page: 11-12, table: 3}
    status: VERIFIED
    note: "NONE. Table 3 gives operation counts only; no per-operation times anywhere in the paper."

# Per-role operation counts as printed. Roles: user / node(sensor,device) / gateway(server). X = count.
ops:
  JIANG_table2:   # per PHASE (both parties combined), NOT per role
    cite: {file: JIANG, pdf_page: 15, table: 2}
    status: VERIFIED
    phases: {P1: registration, P2: login, P3: authentication, P4: password+biometric update, P5: smart-card revocation}
    schemes:
      Lee_Hsu_39: {P1: {TH: 4, TC: 1}, P2: {TH: 5, TC: 2}, P3: {TH: 7, TC: 4}, P4: {TH: 5, TC: 0}, P5: {TH: 4, TC: 1}, overall: {TH: 25, TC: 8}}
      Islam_40:   {P1: {TH: 2, TC: 1}, P2: {TH: 4, TC: 3}, P3: {TH: 7, TC: 4}, P4: {TH: 3, TC: 1}, P5: {TH: 2, TC: 1}, overall: {TH: 18, TC: 10}}
      Jiang_ours: {P1: {TH: 3, TC: 0}, P2: {TH: 4, TC: 2}, P3: {TH: 7, TC: 4}, P4: {TH: 4, TC: 0}, P5: {TH: 3, TC: 0}, overall: {TH: 21, TC: 6}}
    communication_bits: {Lee_Hsu_39: 1584, Islam_40: 1312, Jiang_ours: 1312}
    rounds: {Lee_Hsu_39: 3, Islam_40: 2, Jiang_ours: 2}
    note: "Parties are user U (smart card) and server S only; there is no device/gateway split and no per-role breakdown. The 1312/1584 totals are printed without derivation; field sizes are given only for |p| = 256 and |X_S| = 256 bits (Sec 2/3.1). Hash output length not stated. Request <DI_U,R_U,TI_U,L_U>, response <R_S,TI_S,L_S> (Fig 1)."
  DHILLON_table3:   # user / node / gateway, units of T_h
    cite: {file: DHILLON, pdf_page: 11, journal_page: 265, table: 3}
    status: VERIFIED
    schemes:
      Proposed:      {user: {Th: 8}, node: {Th: 6}, gateway: {Th: 8}}
      An_3:          {user: {Th: 4}, node: {Th: 5}, gateway: {Th: 6}}
      Chen_12:       {user: {Th: 4}, node: {Th: 1}, gateway: {Th: 5}}
      Das_13:        {user: {Th: 5, TE_D: 1}, node: {Th: 4, TE_D: 1}, gateway: {Th: 2, TD_E: 1}}
      Turkanovic_26: {user: {Th: 7}, node: {Th: 5}, gateway: {Th: 7}}
      He_31:         {user: {Th: 5}, node: {Th: 1}, gateway: {Th: 5}}
      Xue_32:        {user: {Th: 7}, node: {Th: 6}, gateway: {Th: 13}}
    hash_size_bits: {value: 128, cite: {file: DHILLON, pdf_page: 12, journal_page: 266, section: 5.2, text: "the size of the hash value generated by both hash operations is 128 bits"}}
    totals_printed: none
    reference_note: "Table 3/4 label Turkanovic as [26], but DHILLON's reference [26] is Weber (IoT challenges); Turkanovic is its [43]. Numbering slip inside DHILLON."
    communication_table: none
    storage_table: none
  CHANGLE_table2:  # light-weight protocols, units t_h and t_XOR, with printed approx seconds
    cite: {file: CHANGLE, pdf_page: 9, journal_page: 365, table: II}
    status: VERIFIED
    schemes:
      Li_11:        {user: {th: 9, txor: 6, printed_s: 0.0045}, sensor: {th: 5, txor: 3, printed_s: 0.0025}, gateway: {th: 12, txor: 6, printed_s: 0.006}}
      Turkanovic_1: {user: {th: 7, txor: 4, printed_s: 0.0035}, sensor: {th: 5, txor: 4, printed_s: 0.0025}, gateway: {th: 7, txor: 4, printed_s: 0.0035}}
      P1:           {user: {th: 7, txor: 4, printed_s: 0.0035}, sensor: {th: 5, txor: 4, printed_s: 0.0025}, gateway: {th: 8, txor: 1, printed_s: 0.004}}
  CHANGLE_table3:  # ECC-based protocols
    cite: {file: CHANGLE, pdf_page: 9, journal_page: 365, table: III}
    status: VERIFIED
    schemes:
      Shi_15:   {user: {tmul: 3, th: 5, printed_s: 0.191725}, sensor: {tmul: 2, th: 3, printed_s: 0.12765}, gateway: {tmul: 1, th: 4, printed_s: 0.065075}}
      Choi_16:  {user: {tmul: 3, th: 9, printed_s: 0.193725}, sensor: {tmul: 2, th: 6, printed_s: 0.12915}, gateway: {tmul: 1, th: 5, printed_s: 0.065575}}
      P2:       {user: {tmul: 2, th: 7, printed_s: 0.12765}, sensor: {tmul: 2, th: 5, printed_s: 0.12865}, gateway: {tmul: 0, th: 9, printed_s: 0.0045}}
    text_claim: {text: "gateway ... runs approximately 14 times faster in P2", cite: {file: CHANGLE, pdf_page: 9, journal_page: 365, section: VI}}
    messages: {value: 4, note: "m1..m4 in the protocol description (Sec IV/V); no bit sizes given", status: UNVERIFIED_for_bits}
  BASE_table5:     # as transcribed in research/paper_audit/paper_tables.py and re-read visually from BASE pdf page 7
    cite: {file: BASE, pdf_page: 7, journal_page: 4489, table: V}
    status: VERIFIED
    note: "Column headings are User/Client, Device C_i, Server S_j. Reused from research/paper_audit/paper_tables.py (imported, not copied) and spot-checked visually in this study."
  BASE_table4:
    cite: {file: BASE, pdf_page: 7, journal_page: 4489, table: IV}
    status: VERIFIED
    note: "Headings: Scheme, Number of Messages, User, device or IoT Node, Gateway or server, Total. Imported from paper_audit/paper_tables.py."
  BASE_table6:
    cite: {file: BASE, pdf_page: 8, journal_page: 4490, table: VI}
    status: "VERIFIED by research/paper_audit/verify_tables.py (OCR); not re-read here"

base_table2_environment:
  cite: {file: BASE, pdf_page: 6, journal_page: 4488, table: II}
  status: VERIFIED
  coverage_area_m: [1500, 1500]
  simulator: OMNeT++
  active_devices: "100 to 1000"
  servers: "5% (one per hundred devices)"   # NOTE: 5% of N is one per TWENTY devices; "one per hundred" is 1%. Internal inconsistency in BASE.
  ta: 1
  sampling_interval: "15 u Sec"
  bandwidth: "10 Mbps"
  energy_tx_mW: 75.6
  energy_rx_mW: 75.6
  xbee_range_m: "500 to 800"
  packet_size: "128 Kbps"        # printed as a rate under 'Packet Size'; text (Sec V-B) says 128 bits per message
  handoff_time: "10 nano Sec"
  device_speed_max: "160 km/hour"   # contradicts 'static' devices in Sec V
  transmission_interval: "Application Oriented"
  adversary: "Randomly Generated"

