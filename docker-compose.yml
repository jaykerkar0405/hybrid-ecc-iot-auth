services:
  # ============================================================================
  # Service 1: Automated Paper-Scale Benchmark Runner
  # Generates report.html, report.md, and comparison plots in ./bench_output_docker
  # ============================================================================
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    image: hybrid-ecc-auth:latest
    container_name: hea-benchmark
    volumes:
      - ./bench_output_docker:/app/bench_output
    command: ["bench-full"]

  # ============================================================================
  # Service 2: Simulated IoT Server Node (With Zigbee / 802.15.4 Network Shaping)
  # ============================================================================
  iot-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: hybrid-ecc-auth:latest
    container_name: hea-server-node
    cap_add:
      - NET_ADMIN
    environment:
      - ENABLE_IOT_NETWORK_SHAPING=true
      - IOT_LINK_PRESET=zigbee
    volumes:
      - ./creds:/app/creds
    networks:
      iot_mesh:
        ipv4_address: 172.28.0.10
    command: ["server", "--credential", "/app/creds/server-A.json", "--host", "0.0.0.0", "--port", "8443"]

  # ============================================================================
  # Service 3: Simulated IoT Device Client (With Zigbee Link Shaping)
  # ============================================================================
  iot-device:
    build:
      context: .
      dockerfile: Dockerfile
    image: hybrid-ecc-auth:latest
    container_name: hea-device-node
    cap_add:
      - NET_ADMIN
    environment:
      - ENABLE_IOT_NETWORK_SHAPING=true
      - IOT_LINK_PRESET=zigbee
    volumes:
      - ./creds:/app/creds
    networks:
      iot_mesh:
        ipv4_address: 172.28.0.20
    depends_on:
      - iot-server
    command: ["device", "--credential", "/app/creds/device-001.json", "--server-id", "server-A", "--server-addr", "172.28.0.10:8443"]

networks:
  iot_mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

