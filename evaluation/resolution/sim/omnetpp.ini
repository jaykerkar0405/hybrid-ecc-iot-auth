# Pseudonym-resolution sweep. Parameters follow BASE Table II (environment) and Tables III-V (proposed scheme:
# 2 T_H + 2 T_SE/D = 11.84 ms per side, the base paper's Table IV 1024 bits over 4 messages). One probe is priced at T_H = 0.32 ms
# (Table III). Values marked ASSUMPTION are ours, used throughout this self-contained model.
[General]
network = ResolveNet
cmdenv-express-mode = true
cmdenv-status-frequency = 1000s
sim-time-limit = 1000s
**.vector-recording = false
**.param-recording = false
repeat = 5
seed-set = ${repetition}
# BASE Table II
*.core.rateBps = 10e6
*.core.rangeM = 500
*.core.quantumS = 15e-6
*.core.handoffS = 10e-9
*.core.txPowerW = 0.0756
*.core.rxPowerW = 0.0756
*.serverFraction = 0.05
# ASSUMPTIONS (not in BASE)
*.adversaryFraction = 0.05
*.core.adversaryRateHz = 1
*.core.windowS = 10
*.core.enrolment = "reachable"
*.core.epochS = 10
# Proposed scheme, BASE Tables III-V
*.core.scheme = "Proposed_V1_T4"
*.core.bitsTotal = 1024
*.core.nMessages = 4
*.core.deviceProcMs = 11.84
*.core.serverProcMs = 11.84
*.core.tProbeMs = 0.32
*.core.rejectMs = 0.32
*.core.costFile = "../../cost_model.csv"
*.numDevices = ${N=1,10,100,200,300,400,500,600,700,800,900,1000}

[Config R_none]
description = "BASE cost model only: no resolution cost (Table V)"
*.core.resolver = "none"
[Config R_O1]
*.core.resolver = "O1"
[Config R_O2]
*.core.resolver = "O2"
[Config R_O3]
*.core.resolver = "O3"
[Config R_O4]
*.core.resolver = "O4"
[Config R_TM]
*.core.resolver = "TM"
[Config R_CR]
*.core.resolver = "CR"
[Config R_MW]
*.core.resolver = "MW"
[Config H_none]
description = "R_none without adversaries"
extends = R_none
*.adversaryFraction = 0
[Config H_O1]
description = "R_O1 without adversaries"
extends = R_O1
*.adversaryFraction = 0
[Config H_O2]
description = "R_O2 without adversaries"
extends = R_O2
*.adversaryFraction = 0
[Config H_O3]
description = "R_O3 without adversaries"
extends = R_O3
*.adversaryFraction = 0
[Config H_O4]
description = "R_O4 without adversaries"
extends = R_O4
*.adversaryFraction = 0
[Config H_TM]
description = "R_TM without adversaries"
extends = R_TM
*.adversaryFraction = 0
[Config H_CR]
description = "R_CR without adversaries"
extends = R_CR
*.adversaryFraction = 0
[Config H_MW]
description = "R_MW without adversaries"
extends = R_MW
*.adversaryFraction = 0
