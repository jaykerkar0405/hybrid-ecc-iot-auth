[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 80000000L   ; stock 80 MHz; set 160000000L to compare
build_flags = -Os -DHEA_BENCH_N=20
