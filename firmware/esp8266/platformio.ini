[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 80000000L   ; stock 80 MHz; set 160000000L to compare
build_flags = -Os -DHEA_BENCH_N=20

; Primitive benchmark for the paper audit: no Wi-Fi, no protocol code.
; pio run -e bench -t upload ; override clock with -DBENCH ... or board_build.f_cpu
[env:bench]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 80000000L
build_flags = -Os -Ibench -DBENCH_NO_31
build_src_filter = -<*> +<../bench/main_esp.cpp> +<../bench/prim_bench.c>

; Fast variant without the (slow) elliptic-curve section
[env:bench_noec]
extends = env:bench
build_flags = -Os -Ibench -DBENCH_NO_31 -DBENCH_SKIP_EC

[env:bench160]
extends = env:bench
board_build.f_cpu = 160000000L
